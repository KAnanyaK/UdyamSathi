function draw(index,elapsed){const s=scenes[index],w=c.width,h=c.height;ctx.fillStyle='#f5f7f2';ctx.fillRect(0,0,w,h);ctx.fillStyle='#1c5547';ctx.fillRect(0,0,w,12);text('UDYAM SATHI',95,105,16,'#527665',800);text(s.tag,95,178,15,'#6b8b7b',800);text(s.title,95,247,38,'#17392f',800);text(s.sub,95,294,19,'#77867d',500);line(95,334,760);let words=s.cap.split(' '),row='',y=400;for(const word of words){const test=row?row+' '+word:word;if(ctx.measureText(test).width>730){text(row,95,y,19,'#40584c',500);row=word;y+=34}else row=test}if(row)text(row,95,y,19,'#40584c',500);phone(s.screen);rr(96,795,1360,11,6,'#e0e8dd');rr(96,795,1360*Math.min(1,elapsed/(scenes.length*9)),11,6,'#58a375');text('Synthetic demo records · No real customer data',95,850,13,'#89968e',500);text(`${String(index+1).padStart(2,'0')} / 08`,1375,850,13,'#6d8175',700)}
let running=false;document.querySelector('#record').onclick=async()=>{if(running)return;running=true;document.querySelector('#record').disabled=true;status.textContent='Recording… this takes about 72 seconds';const stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{const blob=new Blob(chunks,{type:'video/webm'});try{const r=await fetch('/save-video',{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});status.textContent=r.ok?'Finished · saved udyam-sathi-walkthrough.webm':'Recording finished, but save failed. '+await r.text()}catch{status.textContent='Recording finished, use the browser download prompt to save the WebM.';const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='udyam-sathi-walkthrough.webm';a.click()}document.querySelector('#record').textContent='Recorded · 72 seconds'};rec.start();const start=performance.now();function frame(now){const elapsed=Math.max(0,Math.min(scenes.length*9,(now-start)/1000)),index=Math.min(scenes.length-1,Math.floor(elapsed/9));if(!scenes[index]){status.textContent=`Recording stopped at scene ${index}; please retry.`;rec.stop();return}draw(index,elapsed);if(elapsed>=scenes.length*9){rec.stop();return}requestAnimationFrame(frame)}requestAnimationFrame(frame)};draw(0,0);
